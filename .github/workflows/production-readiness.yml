name: Production Readiness Gate

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Full 40-character commit authorized for readiness evaluation
        required: true
        type: string
      environment:
        description: Intended activation environment
        required: true
        default: production
        type: choice
        options:
          - production

permissions:
  contents: read

concurrency:
  group: ef93-production-readiness-${{ inputs.approved_commit }}
  cancel-in-progress: false

jobs:
  identity:
    name: Verify immutable candidate identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      git_commit: ${{ steps.identity.outputs.git_commit }}
      application_version: ${{ steps.identity.outputs.application_version }}
      build_time: ${{ steps.identity.outputs.build_time }}
    steps:
      - name: Validate requested identity syntax
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [ "$TARGET_ENVIRONMENT" = "production" ]

      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}
          fetch-depth: 1

      - name: Derive identity from checkout
        id: identity
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: |
          set -euo pipefail
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          [ "$CHECKED_OUT_COMMIT" = "$APPROVED_COMMIT" ]
          APP_VERSION="$(node -p "require('./package.json').version")"
          test -n "$APP_VERSION"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "git_commit=$CHECKED_OUT_COMMIT"
            echo "application_version=$APP_VERSION"
            echo "build_time=$BUILD_TIME"
          } >> "$GITHUB_OUTPUT"

  release-regression:
    name: EF-94 and EF-95 canonical release regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}
          fetch-depth: 1

      - name: Verify checkout identity
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run EF-94 canonical command backed by EF-95 manifest
        run: pnpm run test:release

  secret-scan:
    name: Gitleaks current tree for approved commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}
          fetch-depth: 1

      - name: Verify checkout identity
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"

      - name: Scan approved current tree
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect \
            --source=/repo \
            --no-git \
            --config=/repo/.gitleaks.toml \
            --redact \
            --verbose

  artifact-readiness:
    name: Build immutable production readiness artifact
    needs: [identity, release-regression, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.git_commit }}
          fetch-depth: 1

      - name: Verify checkout identity
        env:
          APPROVED_COMMIT: ${{ needs.identity.outputs.git_commit }}
        run: test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build candidate without activation
        env:
          EXPO_PUBLIC_APP_ENV: production
        run: |
          set -euo pipefail
          pnpm --dir client exec expo export --platform web --output-dir dist
          pnpm --dir server run build

      - name: Package exact build and embed synthetic-safe identity
        env:
          GIT_COMMIT: ${{ needs.identity.outputs.git_commit }}
          APP_VERSION: ${{ needs.identity.outputs.application_version }}
          BUILD_TIME: ${{ needs.identity.outputs.build_time }}
        run: |
          set -euo pipefail
          mkdir -p readiness/frontend readiness/backend readiness/evidence
          cp -R client/dist/. readiness/frontend/
          cp -R server/dist/. readiness/backend/
          node -e "const fs=require('fs');const v={gitCommit:process.env.GIT_COMMIT,applicationVersion:process.env.APP_VERSION,buildTime:process.env.BUILD_TIME,environment:'production'};for(const p of ['readiness/frontend/artifact-identity.json','readiness/backend/artifact-identity.json'])fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n')"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf readiness/evidence/frontend.tar.gz -C readiness/frontend .
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf readiness/evidence/backend.tar.gz -C readiness/backend .

      - name: Generate and verify fail-closed readiness manifest
        env:
          APPROVED_COMMIT: ${{ needs.identity.outputs.git_commit }}
          APP_VERSION: ${{ needs.identity.outputs.application_version }}
          BUILD_TIME: ${{ needs.identity.outputs.build_time }}
        run: |
          set -euo pipefail
          node scripts/production-readiness-gate.mjs generate \
            --approved-commit "$APPROVED_COMMIT" \
            --app-version "$APP_VERSION" \
            --build-time "$BUILD_TIME" \
            --ef95-manifest scripts/release-suite.manifest.json \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "Production Readiness Gate" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact frontend.tar.gz=readiness/evidence/frontend.tar.gz \
            --artifact backend.tar.gz=readiness/evidence/backend.tar.gz \
            --output readiness/evidence/production-readiness-manifest.json
          node scripts/production-readiness-gate.mjs validate \
            --approved-commit "$APPROVED_COMMIT" \
            --manifest readiness/evidence/production-readiness-manifest.json \
            --artifact frontend.tar.gz=readiness/evidence/frontend.tar.gz \
            --artifact backend.tar.gz=readiness/evidence/backend.tar.gz
          sha256sum readiness/evidence/production-readiness-manifest.json \
            > readiness/evidence/production-readiness-manifest.sha256
          printf '%s\n' \
            'status=ready-for-authorization-review' \
            "gitCommit=$APPROVED_COMMIT" \
            "applicationVersion=$APP_VERSION" \
            'environment=production' \
            'activationPerformed=false' \
            > readiness/evidence/gate-summary.txt

      - name: Upload sanitized readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-${{ needs.identity.outputs.git_commit }}
          path: readiness/evidence/
          if-no-files-found: error
          retention-days: 30
