name: Protected Fixed PR Admission

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - dev

permissions:
  contents: read
  pull-requests: read

jobs:
  fixed-successor-admission:
    name: Protected fixed successor admission
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # This pinned platform action resolves refs/heads/dev exactly once. The
      # resolved commit must also be the commit that supplied this workflow.
      # No pull-request Head file is checked out, read, sourced, or executed.
      - name: Checkout protected dev authority snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: susiexuejing/chat-app
          ref: refs/heads/dev
          path: authority
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze protected dev authority snapshot
        id: authority_snapshot
        working-directory: authority
        shell: bash
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          AUTHORITY_SHA="$(git rev-parse --verify HEAD)"
          test "$AUTHORITY_SHA" = "$EXPECTED_WORKFLOW_SHA"
          echo "sha=$AUTHORITY_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify fixed admission from protected snapshot
        working-directory: authority
        env:
          EF_AUTHORITY_SNAPSHOT_SHA: ${{ steps.authority_snapshot.outputs.sha }}
        run: node scripts/fixed-pr-admission.mjs
