name: Fixed PR Admission Reassessment

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Exact fixed pull request number already registered by protected dev
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  reassess-fixed-pr-admission:
    name: Reassess fixed PR admission from protected dev
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # All executable admission logic is checked out from protected dev. The
      # pull-request head is never checked out, read, sourced, or executed.
      - name: Checkout protected dev authority snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: susiexuejing/chat-app
          ref: refs/heads/dev
          path: authority
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze protected dev authority snapshot
        id: authority_snapshot
        working-directory: authority
        shell: bash
        run: |
          set -euo pipefail
          AUTHORITY_SHA="$(git rev-parse --verify HEAD)"
          echo "sha=$AUTHORITY_SHA" >> "$GITHUB_OUTPUT"

      # This pinned action calls only the GitHub pull-request metadata API.
      # It writes the minimal identity object into the protected authority
      # checkout; it never fetches pull-request content.
      - name: Read fixed pull request identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const numberText = context.payload.inputs?.pull_request_number;
            if (!/^[1-9][0-9]*$/.test(numberText)) {
              core.setFailed('invalid pull request number');
              return;
            }
            const pull_number = Number(numberText);
            const { data: pr } = await github.rest.pulls.get({
              owner: 'susiexuejing',
              repo: 'chat-app',
              pull_number,
            });
            const metadata = {
              schemaVersion: 1,
              source: 'github-rest-pulls-get-v1',
              pullRequest: {
                number: pr.number,
                head: { sha: pr.head.sha, ref: pr.head.ref, repoFullName: pr.head.repo.full_name },
                base: { ref: pr.base.ref, repoFullName: pr.base.repo.full_name },
              },
            };
            require('node:fs').writeFileSync(
              `${process.env.GITHUB_WORKSPACE}/authority/.ef240-fixed-pr-reassessment.json`,
              `${JSON.stringify(metadata)}\n`,
              { encoding: 'utf8', mode: 0o600 },
            );

      - name: Verify fixed admission from protected snapshot
        working-directory: authority
        env:
          EF_AUTHORITY_SNAPSHOT_SHA: ${{ steps.authority_snapshot.outputs.sha }}
          EF_ADMISSION_REASSESSMENT_MODE: base-owned-fixed-pr-reassessment-v1
          EF_ADMISSION_REASSESSMENT_METADATA: .ef240-fixed-pr-reassessment.json
        run: node scripts/fixed-pr-admission.mjs
