name: Deploy Frontend to Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emotionflow-dev-deployment
  cancel-in-progress: false

jobs:
  test-build-deploy:
    name: Test, build and deploy dev
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runtime data is not tracked or bundled
        run: pnpm run check:runtime-data

      - name: Run client tests
        run: pnpm --dir client exec jest --runInBand

      - name: Build dev frontend
        env:
          EXPO_PUBLIC_APP_ENV: DEV
        run: pnpm --dir client exec expo export --platform web --output-dir dist

      - name: Record deployed commit
        run: printf '%s\n' "$GITHUB_SHA" > client/dist/deployment-sha.txt

      - name: Create deployment version HTML page
        run: |
          cat > client/dist/deployment-version.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Deployment Version</title>
          </head>
          <body>
            <main>
              <h1>Deployment Version</h1>
              <p>Environment: DEV</p>
              <p>Commit SHA: ${GITHUB_SHA}</p>
            </main>
          </body>
          </html>
          EOF

      - name: Verify release artifact excludes runtime data
        run: pnpm run check:runtime-data

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/dev_deploy_key
          chmod 600 ~/.ssh/dev_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload build
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
        run: |
          RELEASE_DIR="/tmp/emotionflow-dev-$GITHUB_SHA"
          ssh -i ~/.ssh/dev_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$RELEASE_DIR'"
          rsync -az --delete -e "ssh -i ~/.ssh/dev_deploy_key -p $SSH_PORT" client/dist/ "$SSH_USER@$SSH_HOST:$RELEASE_DIR/"

      - name: Activate dev release
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
        run: |
          ssh -i ~/.ssh/dev_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_SHA=$GITHUB_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          DEPLOY_DIR=/var/www/chat-app/dev
          RELEASE_DIR="/tmp/emotionflow-dev-$DEPLOY_SHA"
          BACKUP_DIR=/var/www/chat-app/dev-backups
          mkdir -p "$DEPLOY_DIR" "$BACKUP_DIR"
          if [ -n "$(ls -A "$DEPLOY_DIR" 2>/dev/null)" ]; then
            tar -czf "$BACKUP_DIR/dev-$(date +%Y%m%d-%H%M%S).tar.gz" -C "$DEPLOY_DIR" .
          fi
          rsync -a --delete "$RELEASE_DIR/" "$DEPLOY_DIR/"
          rm -rf "$RELEASE_DIR"
          find "$BACKUP_DIR" -type f -name 'dev-*.tar.gz' -mtime +14 -delete
          REMOTE

      - name: Verify dev deployment
        run: |
          for attempt in 1 2 3 4 5; do
            deployed_sha="$(
              curl --fail --silent --show-error \
                https://dev.douhaoyu.cn/deployment-sha.txt || true
            )"

            html_sha="$(
              curl --fail --silent --show-error \
                https://dev.douhaoyu.cn/deployment-version.html \
                | grep -oE '[0-9a-f]{40}' \
                | head -1 || true
            )"

            if [ "$deployed_sha" = "$GITHUB_SHA" ] &&
               [ "$html_sha" = "$GITHUB_SHA" ]; then
              echo "DEV deployment verified at $GITHUB_SHA"
              exit 0
            fi

            echo "Waiting for deployment evidence ($attempt/5)"
            sleep 5
          done

          echo "DEV deployment verification failed."
          exit 1
